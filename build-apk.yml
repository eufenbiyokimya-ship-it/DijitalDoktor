name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Android lisanslarini kabul et
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Projeyi hazirla ve derle
        run: |
          if [ -f DijitalDoktor-AndroidStudio.zip ]; then
            mkdir -p proje
            unzip -q -o DijitalDoktor-AndroidStudio.zip -d proje
            cd proje
          fi
          S=$(find . -name settings.gradle | head -1)
          echo "Proje: $S"
          cd "$(dirname "$S")"
          ls
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DijitalDoktor-APK
          path: "**/app-debug.apk"
