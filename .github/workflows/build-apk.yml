name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Proje klasorunu bul ve derle
        run: |
          S=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -1)
          echo "Proje: $S"
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DijitalDoktor-APK
          path: "**/app-debug.apk"
